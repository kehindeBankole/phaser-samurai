<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Samurai" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Samurai</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #0d0f17;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        width: 100%;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      canvas { image-rendering: pixelated; }

      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0d0f17;
        color: #e8e3d3;
        font: 18px/1.5 monospace;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      #rotate .phone {
        width: 44px;
        height: 76px;
        border: 4px solid #e8e3d3;
        border-radius: 8px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      #rotate-btn {
        font: bold 18px monospace;
        color: #0d0f17;
        background: #ffd166;
        border: 0;
        border-radius: 10px;
        padding: 14px 26px;
        min-height: 48px;
        cursor: pointer;
        transition: transform 120ms ease-out;
      }
      #rotate-btn:active { transform: scale(0.96); }
      #rotate-btn[hidden] { display: none; }
      @media (prefers-reduced-motion: reduce) {
        #rotate .phone { animation: none; transform: rotate(-90deg); }
      }
      /* Phones and tablets held upright: ask for landscape. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate" role="dialog" aria-labelledby="rotate-msg">
      <div class="phone"></div>
      <div id="rotate-msg">Turn your phone sideways<br />to play</div>
      <button id="rotate-btn" type="button" hidden>Play in landscape</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
